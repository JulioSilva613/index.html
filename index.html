<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>VHS Cam - Profissional</title>

  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
    }

    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: #0a0a0a;
      font-family: 'Courier New', monospace;
      color: #fff;
      touch-action: none;
      overscroll-behavior: none;
    }

    #app {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      overflow: hidden;
    }

    #vhsCanvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      background: #111;
      z-index: 1;
    }

    .zoom-indicator {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 130px);
      left: 50%; transform: translateX(-50%);
      z-index: 15;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      padding: 5px 16px; border-radius: 20px;
      font-size: 13px; letter-spacing: 1px;
      border: 1px solid rgba(255,255,255,0.12);
      pointer-events: none; opacity: 0;
      transition: opacity 0.3s; font-family: monospace;
    }
    .zoom-indicator.visible { opacity: 1; }

    .mode-indicator {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 95px);
      left: 50%; transform: translateX(-50%);
      z-index: 15;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      padding: 4px 14px; border-radius: 12px;
      font-size: 11px; letter-spacing: 2px;
      border: 1px solid rgba(255,255,255,0.08);
      pointer-events: none; font-family: monospace;
      transition: all 0.3s;
    }
    .mode-indicator.photo-mode { color: #4fc3f7; border-color: rgba(79, 195, 247, 0.3); }
    .mode-indicator.video-mode { color: #ff6b6b; border-color: rgba(255, 107, 107, 0.3); }

    .ui-overlay {
      position: absolute; inset: 0;
      z-index: 10; pointer-events: none;
    }

    .ui-overlay .top {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 15px);
      left: 15px; right: 15px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 14px;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
    }

    .rec-indicator { display: flex; align-items: center; gap: 10px; }

    .rec-dot {
      width: 14px; height: 14px; border-radius: 50%;
      background: #555;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .rec-dot.recording {
      background: #ff2a2a;
      box-shadow: 0 0 20px #ff0000;
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
    }

    .timer {
      font-size: 18px; letter-spacing: 2px;
      background: rgba(0, 0, 0, 0.5);
      padding: 2px 12px; border-radius: 4px;
      backdrop-filter: blur(4px);
    }
    .date { opacity: 0.7; font-size: 13px; }

    .ui-overlay .mode {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 115px);
      left: 0; right: 0; text-align: center;
      font-size: 12px; letter-spacing: 3px;
      opacity: 0.5;
      text-shadow: 0 0 8px black;
    }

    .ui-overlay .bottom {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 25px);
      left: 0; right: 0;
      display: flex; justify-content: center; align-items: center;
      gap: 40px; pointer-events: auto;
    }

    .bottom button {
      background: none; border: none; color: white;
      cursor: pointer; pointer-events: auto;
      display: flex; justify-content: center; align-items: center;
      transition: transform 0.1s; outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .bottom button:active { transform: scale(0.88); }

    .capture-btn {
      width: 85px; height: 85px; border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 0 6px rgba(0, 0, 0, 0.4), 0 0 35px rgba(255, 255, 255, 0.1);
      font-size: 18px; font-weight: bold;
      color: rgba(255, 255, 255, 0.9);
    }
    .capture-btn.recording-mode {
      border-color: #ff2a2a;
      box-shadow: 0 0 0 6px rgba(0, 0, 0, 0.4), 0 0 45px rgba(255, 0, 0, 0.25);
    }

    .action-btn {
      width: 55px; height: 55px; border-radius: 50%;
      background: rgba(20, 20, 20, 0.7);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 22px;
    }

    #settingsPanel {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      z-index: 30;
      width: min(280px, 78vw);
      background: rgba(10, 10, 10, 0.78);
      backdrop-filter: blur(8px) saturate(1.2);
      -webkit-backdrop-filter: blur(8px) saturate(1.2);
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      padding: 14px 12px calc(env(safe-area-inset-bottom, 0px) + 14px);
      display: flex; flex-direction: column;
      gap: 8px;
      pointer-events: auto;
      font-size: 11px;
      box-shadow: -10px 0 40px rgba(0, 0, 0, 0.5);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      transform: translateX(100%);
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }
    #settingsPanel.open { transform: translateX(0); }

    #settingsPanel h3 {
      font-size: 12px; letter-spacing: 2px;
      text-align: center;
      margin-bottom: 2px;
      padding-top: 4px;
      opacity: 0.75;
    }

    .settings-close {
      position: absolute;
      top: 10px; right: 10px;
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff; font-size: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      pointer-events: auto;
    }
    .settings-close:active { transform: scale(0.9); }

    .setting-item { display: flex; flex-direction: column; gap: 3px; }

    .setting-item label {
      display: flex; justify-content: space-between;
      opacity: 0.7; font-size: 10px;
    }

    .setting-item input[type="range"] {
      width: 100%; height: 3px;
      -webkit-appearance: none; appearance: none;
      background: #333; border-radius: 2px; outline: none;
    }
    .setting-item input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 16px; height: 16px; border-radius: 50%;
      background: #fff; cursor: pointer;
      box-shadow: 0 0 8px rgba(255,255,255,0.3);
    }
    .setting-item input[type="range"]::-moz-range-thumb {
      width: 16px; height: 16px; border-radius: 50%;
      background: #fff; cursor: pointer; border: none;
    }

    .settings-divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.08);
      margin: 2px 0;
    }

    .orientation-buttons {
      display: flex; gap: 6px;
      justify-content: center; margin-top: 2px;
    }

    .orientation-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff; padding: 6px 4px;
      border-radius: 4px; cursor: pointer;
      font-family: monospace; font-size: 10px;
      transition: all 0.2s; pointer-events: auto; flex: 1;
    }
    .orientation-btn.active {
      background: rgba(255,255,255,0.2);
      border-color: rgba(255,255,255,0.5);
    }
    .orientation-btn:active { transform: scale(0.95); }
    .orientation-btn .icon { font-size: 14px; display: block; margin-bottom: 1px; }

    .mode-toggle-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff; padding: 8px;
      border-radius: 4px; cursor: pointer;
      font-family: monospace; font-size: 11px;
      transition: all 0.2s; pointer-events: auto;
      width: 100%; text-align: center; letter-spacing: 1px;
    }
    .mode-toggle-btn.photo { color: #4fc3f7; border-color: rgba(79, 195, 247, 0.3); background: rgba(79, 195, 247, 0.05); }
    .mode-toggle-btn.video { color: #ff6b6b; border-color: rgba(255, 107, 107, 0.3); background: rgba(255, 107, 107, 0.05); }
    .mode-toggle-btn:active { transform: scale(0.97); }

    #startupScreen {
      position: absolute; inset: 0; z-index: 100;
      background: #050505;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; gap: 20px;
      transition: opacity 0.4s;
    }
    #startupScreen.hidden { opacity: 0; pointer-events: none; }
    #startupScreen h1 { font-size: 52px; letter-spacing: 8px; font-weight: 100; }
    #startupScreen p { font-size: 11px; opacity: 0.4; letter-spacing: 3px; }
    #startupScreen .start-btn {
      padding: 14px 35px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.05);
      color: #fff; font-family: 'Courier New', monospace;
      letter-spacing: 3px; cursor: pointer;
      transition: background 0.2s; border-radius: 4px;
      font-size: 14px; pointer-events: auto;
    }
    #startupScreen .start-btn:active { background: rgba(255, 255, 255, 0.12); }

    .toast {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 130px);
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      z-index: 200;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      color: #fff; padding: 10px 24px;
      border-radius: 8px; font-family: monospace;
      font-size: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      text-align: center;
      max-width: 90vw;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    #settingsPanel::-webkit-scrollbar { width: 4px; }
    #settingsPanel::-webkit-scrollbar-track { background: transparent; }
    #settingsPanel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

    #panelBackdrop {
      position: absolute; inset: 0; z-index: 25;
      background: transparent;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
    }
    #panelBackdrop.open { opacity: 1; pointer-events: auto; }

    @media (max-width: 480px) {
      .ui-overlay .top { font-size: 12px; }
      .capture-btn { width: 72px; height: 72px; }
      .action-btn { width: 48px; height: 48px; font-size: 18px; }
      .ui-overlay .bottom { gap: 28px; }
      #startupScreen h1 { font-size: 38px; }
      #settingsPanel { width: min(260px, 82vw); }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      .ui-overlay .bottom { bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); gap: 24px; }
      .capture-btn { width: 60px; height: 60px; font-size: 14px; }
      .action-btn { width: 42px; height: 42px; font-size: 16px; }
      .mode-indicator, .zoom-indicator { bottom: calc(env(safe-area-inset-bottom, 0px) + 80px); }
      #startupScreen h1 { font-size: 32px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="vhsCanvas"></canvas>

    <div class="zoom-indicator" id="zoomIndicator">1.0x</div>
    <div class="mode-indicator photo-mode" id="modeIndicator">📷 FOTO</div>
    <div class="toast" id="toast"></div>

    <div class="ui-overlay">
      <div class="top">
        <div class="rec-indicator">
          <span class="rec-dot" id="recDot"></span>
          <span id="recText">STBY</span>
          <span class="timer" id="timerDisplay" style="display: none;">00:00</span>
        </div>
        <span class="date" id="dateDisplay">00/00/0000</span>
      </div>
      <div class="mode">VHS • SP • NTSC</div>
      <div class="bottom">
        <button class="action-btn" id="switchCameraBtn" aria-label="Trocar câmera">↻</button>
        <button class="capture-btn" id="captureBtn" aria-label="Capturar ou gravar">●</button>
        <button class="action-btn" id="settingsBtn" aria-label="Configurações">⚙</button>
      </div>
    </div>

    <div id="panelBackdrop"></div>

    <div id="settingsPanel" role="dialog" aria-label="Configurações">
      <button class="settings-close" id="settingsClose" aria-label="Fechar">✕</button>
      <h3>🎛️ CONTROLES VHS</h3>

      <hr class="settings-divider">
      <button class="mode-toggle-btn photo" id="modeToggleBtn">📷 MODO FOTO</button>
      <hr class="settings-divider">

      <div class="setting-item">
        <label><span>🔄 Orientação</span></label>
        <div class="orientation-buttons">
          <button class="orientation-btn" id="flipHorizontal"><span class="icon">↔</span>H</button>
          <button class="orientation-btn" id="flipVertical"><span class="icon">↕</span>V</button>
          <button class="orientation-btn" id="resetOrientation"><span class="icon">⟳</span>R</button>
        </div>
      </div>

      <hr class="settings-divider">

      <div class="setting-item">
        <label><span>🔍 Zoom</span><span id="zoomVal">1.0x</span></label>
        <input type="range" id="zoomSlider" min="10" max="40" value="20">
      </div>

      <div class="setting-item">
        <label><span>☀️ Luz</span><span id="brightnessVal">100%</span></label>
        <input type="range" id="brightnessSlider" min="30" max="200" value="100">
      </div>

      <div class="setting-item">
        <label><span>🎨 Contraste</span><span id="contrastVal">100%</span></label>
        <input type="range" id="contrastSlider" min="30" max="200" value="100">
      </div>

      <hr class="settings-divider">

      <div class="setting-item">
        <label><span>🔴 R</span><span id="redVal">100%</span></label>
        <input type="range" id="redSlider" min="50" max="200" value="100">
      </div>
      <div class="setting-item">
        <label><span>🟢 G</span><span id="greenVal">100%</span></label>
        <input type="range" id="greenSlider" min="50" max="200" value="100">
      </div>
      <div class="setting-item">
        <label><span>🔵 B</span><span id="blueVal">100%</span></label>
        <input type="range" id="blueSlider" min="50" max="200" value="100">
      </div>

      <hr class="settings-divider">

      <div class="setting-item">
        <label><span>📺 Ruído</span><span id="noiseVal">15%</span></label>
        <input type="range" id="noiseSlider" min="0" max="40" value="15">
      </div>
      <div class="setting-item">
        <label><span>🌈 Cromático</span><span id="chromaVal">20%</span></label>
        <input type="range" id="chromaSlider" min="0" max="50" value="20">
      </div>
      <div class="setting-item">
        <label><span>📳 Trepidação</span><span id="jitterVal">8%</span></label>
        <input type="range" id="jitterSlider" min="0" max="15" value="8">
      </div>
      <div class="setting-item">
        <label><span>〰️ Scanlines</span><span id="scanVal">12%</span></label>
        <input type="range" id="scanSlider" min="0" max="30" value="12">
      </div>

      <hr class="settings-divider">
      <button class="mode-toggle-btn" id="resetAllBtn" style="color:#ffaa00;border-color:rgba(255,170,0,0.3);">⟲ RESTAURAR PADRÕES</button>
    </div>

    <div id="startupScreen">
      <h1>VHS</h1>
      <p>PROFESSIONAL CAMERA SYSTEM</p>
      <button class="start-btn" id="startBtn">▶ INICIAR</button>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      const $ = (id) => document.getElementById(id);
      const canvas = $('vhsCanvas');

      const gl = canvas.getContext('webgl', {
        alpha: false,
        antialias: false,
        preserveDrawingBuffer: false,
        powerPreference: 'high-performance',
        desynchronized: true
      });

      if (!gl) { alert('WebGL não suportado.'); return; }

      const startupScreen = $('startupScreen');
      const startBtn = $('startBtn');
      const captureBtn = $('captureBtn');
      const switchCameraBtn = $('switchCameraBtn');
      const settingsBtn = $('settingsBtn');
      const settingsPanel = $('settingsPanel');
      const settingsClose = $('settingsClose');
      const panelBackdrop = $('panelBackdrop');
      const zoomIndicator = $('zoomIndicator');
      const modeIndicator = $('modeIndicator');
      const toast = $('toast');
      const recDot = $('recDot');
      const recText = $('recText');
      const timerDisplay = $('timerDisplay');
      const dateDisplay = $('dateDisplay');
      const flipHorizontalBtn = $('flipHorizontal');
      const flipVerticalBtn = $('flipVertical');
      const resetOrientationBtn = $('resetOrientation');
      const modeToggleBtn = $('modeToggleBtn');
      const resetAllBtn = $('resetAllBtn');

      // ============================================================
      // ESTADO
      // ============================================================
      const DEFAULT_SETTINGS = {
        zoom: 1.0, brightness: 1.0, contrast: 1.0,
        red: 1.0, green: 1.0, blue: 1.0,
        noise: 0.15, chroma: 0.20, jitter: 0.08, scanlines: 0.12,
        flipH: false, flipV: false
      };

      let settings = { ...DEFAULT_SETTINGS };
      let captureMode = 'photo';
      let facingMode = 'environment';
      let stream = null;
      let videoElement = null;
      let videoTexture = null;
      let glProgram = null;
      let animationFrame = null;
      let isRendering = false;
      let isCameraReady = false;
      let isRecording = false;
      let recordingStartTime = 0;
      let timerInterval = null;
      let mediaRecorder = null;
      let recordedChunks = [];
      let zoomTimeout = null;
      let toastTimeout = null;
      let tapeEffectTimeout = null;
      let isStarting = false;
      let lastFrameTime = 0;
      let cameraWarmupUntil = 0; // timestamp até quando ignorar frames de warm-up

      // Resolução interna fixa (mesma para ambas as câmeras → FPS igual)
      const RENDER_W = 1280;
      const RENDER_H = 720;

      // ============================================================
      // WEBGL
      // ============================================================
      function initWebGL() {
        const vsSource = `
          attribute vec2 aPosition;
          varying vec2 vUv;
          uniform float uFlipH;
          uniform float uFlipV;
          void main() {
            gl_Position = vec4(aPosition, 0.0, 1.0);
            vec2 uv = vec2(aPosition.x * 0.5 + 0.5, 1.0 - (aPosition.y * 0.5 + 0.5));
            if (uFlipH > 0.5) uv.x = 1.0 - uv.x;
            if (uFlipV > 0.5) uv.y = 1.0 - uv.y;
            vUv = uv;
          }
        `;

        // Shader com:
        //  - Denoise suave (média 3x3 leve) para compensar ruído da câmera traseira
        //  - Sharpen leve (unsharp mask) para compensar downscale
        //  - Filtros VHS aplicados DEPOIS da limpeza
        const fsSource = `
          precision mediump float;
          varying vec2 vUv;
          uniform sampler2D uTexture;
          uniform float uTime;
          uniform float uZoom;
          uniform float uBrightness;
          uniform float uContrast;
          uniform float uRed;
          uniform float uGreen;
          uniform float uBlue;
          uniform float uNoise;
          uniform float uChroma;
          uniform float uJitter;
          uniform float uScanlines;
          uniform vec2 uResolution;
          uniform vec2 uTexel;

          float random(vec2 st) {
            return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123);
          }

          // Denoise 3x3 rápido (só 5 amostras em cruz — mais barato)
          vec3 denoise(vec2 uv) {
            vec3 c = texture2D(uTexture, uv).rgb;
            vec3 n = texture2D(uTexture, uv + vec2(0.0, uTexel.y)).rgb;
            vec3 s = texture2D(uTexture, uv - vec2(0.0, uTexel.y)).rgb;
            vec3 e = texture2D(uTexture, uv + vec2(uTexel.x, 0.0)).rgb;
            vec3 w = texture2D(uTexture, uv - vec2(uTexel.x, 0.0)).rgb;
            // Média ponderada: centro pesa mais
            return c * 0.4 + (n + s + e + w) * 0.15;
          }

          void main() {
            vec2 uv = vUv;
            float time = uTime;

            // Zoom
            vec2 center = vec2(0.5, 0.5);
            uv = center + (uv - center) * (1.0 / uZoom);

            if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) {
              gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
              return;
            }

            // Ruído pseudoaleatório único por pixel (economiza)
            float rnd = random(vec2(time * 0.1, floor(uv.y * 240.0)));

            // Jitter horizontal
            uv.x += (rnd - 0.5) * uJitter * 0.04;

            // Tracking vertical
            uv.y += (rnd - 0.5) * 0.0015;

            // ---- Limpeza da imagem (só na câmera traseira, mas aplicamos em ambas para uniformidade) ----
            // Se o denoise ficar muito pesado, reduza o mix abaixo.
            vec3 centerSample = texture2D(uTexture, uv).rgb;
            vec3 denoised = denoise(uv);
            // 55% original + 45% denoised (preserva detalhe mas limpa ruído)
            vec3 cleaned = mix(centerSample, denoised, 0.45);

            // Sharpen (unsharp mask leve)
            vec3 blur = denoise(uv);
            vec3 sharpened = cleaned + (cleaned - blur) * 0.35;

            // Aberração cromática sobre a imagem limpa
            float chromaShift = uChroma * 0.006;
            float r = texture2D(uTexture, uv + vec2(chromaShift, 0.0)).r;
            float g = sharpened.g;
            float b = texture2D(uTexture, uv - vec2(chromaShift, 0.0)).b;
            vec3 color = vec3(r, g, b);

            // Canais RGB
            color.r *= uRed;
            color.g *= uGreen;
            color.b *= uBlue;

            // Contraste e brilho
            color = (color - 0.5) * uContrast + 0.5;
            color *= uBrightness;

            // Tom VHS
            color.r *= 1.04;
            color.b *= 0.94;

            // Saturação
            float gray = dot(color, vec3(0.299, 0.587, 0.114));
            color = mix(vec3(gray), color, 0.9);

            // Ruído VHS
            float noise = (rnd - 0.5) * uNoise * 0.3;
            color += noise;

            // Flicker
            color *= 1.0 + sin(time * 8.0) * 0.012;

            // Scanlines
            float scanline = sin(uv.y * uResolution.y * 0.6);
            color *= 1.0 - uScanlines * 0.15 * (scanline * 0.5 + 0.5);

            gl_FragColor = vec4(clamp(color, 0.0, 1.0), 1.0);
          }
        `;

        const compile = (type, src) => {
          const s = gl.createShader(type);
          gl.shaderSource(s, src);
          gl.compileShader(s);
          if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
            console.error('Shader error:', gl.getShaderInfoLog(s));
            return null;
          }
          return s;
        };

        const vs = compile(gl.VERTEX_SHADER, vsSource);
        const fs = compile(gl.FRAGMENT_SHADER, fsSource);
        if (!vs || !fs) return null;

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          console.error('Link error:', gl.getProgramInfoLog(program));
          return null;
        }

        const loc = (name) => gl.getUniformLocation(program, name);

        const positions = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

        videoTexture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, videoTexture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

        return {
          program,
          positionLocation: gl.getAttribLocation(program, 'aPosition'),
          textureLocation: loc('uTexture'),
          timeLocation: loc('uTime'),
          flipHLocation: loc('uFlipH'),
          flipVLocation: loc('uFlipV'),
          zoomLocation: loc('uZoom'),
          brightnessLocation: loc('uBrightness'),
          contrastLocation: loc('uContrast'),
          redLocation: loc('uRed'),
          greenLocation: loc('uGreen'),
          blueLocation: loc('uBlue'),
          noiseLocation: loc('uNoise'),
          chromaLocation: loc('uChroma'),
          jitterLocation: loc('uJitter'),
          scanLocation: loc('uScanlines'),
          resolutionLocation: loc('uResolution'),
          texelLocation: loc('uTexel'),
          positionBuffer
        };
      }

      function resizeCanvas() {
        if (canvas.width !== RENDER_W || canvas.height !== RENDER_H) {
          canvas.width = RENDER_W;
          canvas.height = RENDER_H;
        }
        gl.viewport(0, 0, RENDER_W, RENDER_H);
      }

      // ============================================================
      // RENDER
      // ============================================================
      function drawFrame(time) {
        if (!glProgram || !videoElement || !isCameraReady) return;

        // Ignora frames durante warm-up da câmera (evita frames pretos/borrados)
        if (performance.now() < cameraWarmupUntil) return;

        const p = glProgram;

        if (videoElement.readyState >= videoElement.HAVE_CURRENT_DATA) {
          gl.bindTexture(gl.TEXTURE_2D, videoTexture);
          try {
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, videoElement);
          } catch (e) { /* frame não pronto */ }
        }

        gl.viewport(0, 0, RENDER_W, RENDER_H);
        gl.clearColor(0, 0, 0, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);

        gl.useProgram(p.program);
        gl.bindBuffer(gl.ARRAY_BUFFER, p.positionBuffer);
        gl.enableVertexAttribArray(p.positionLocation);
        gl.vertexAttribPointer(p.positionLocation, 2, gl.FLOAT, false, 0, 0);

        gl.uniform1i(p.textureLocation, 0);
        gl.uniform1f(p.timeLocation, time / 1000);
        gl.uniform1f(p.flipHLocation, settings.flipH ? 1 : 0);
        gl.uniform1f(p.flipVLocation, settings.flipV ? 1 : 0);
        gl.uniform1f(p.zoomLocation, settings.zoom);
        gl.uniform1f(p.brightnessLocation, settings.brightness);
        gl.uniform1f(p.contrastLocation, settings.contrast);
        gl.uniform1f(p.redLocation, settings.red);
        gl.uniform1f(p.greenLocation, settings.green);
        gl.uniform1f(p.blueLocation, settings.blue);
        gl.uniform1f(p.noiseLocation, settings.noise);
        gl.uniform1f(p.chromaLocation, settings.chroma);
        gl.uniform1f(p.jitterLocation, settings.jitter);
        gl.uniform1f(p.scanLocation, settings.scanlines);
        gl.uniform2f(p.resolutionLocation, RENDER_W, RENDER_H);
        // Texel size para o denoise (1 pixel do vídeo original)
        const vw = videoElement.videoWidth || 1280;
        const vh = videoElement.videoHeight || 720;
        gl.uniform2f(p.texelLocation, 1.0 / vw, 1.0 / vh);

        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }

      function renderLoop(time) {
        if (!isRendering) return;

        const elapsed = time - lastFrameTime;
        if (elapsed >= 30) {
          lastFrameTime = time;
          drawFrame(time);
        }

        animationFrame = requestAnimationFrame(renderLoop);
      }

      // ============================================================
      // CÂMERA — resolução IGUAL para ambas (720p)
      // ============================================================
      async function startCamera() {
        if (isStarting) return;
        isStarting = true;

        try {
          if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
          if (videoElement) videoElement.srcObject = null;

          // 720p exato para AMBAS as câmeras → mesmo FPS, mesma qualidade
          // Em muitos celulares, forçar 720p na traseira evita o modo 1080p@15fps
          const constraints = {
            video: {
              facingMode: { ideal: facingMode },
              width: { exact: 1280 },
              height: { exact: 720 },
              frameRate: { ideal: 30, max: 30 }
            },
            audio: {
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false
            }
          };

          try {
            stream = await navigator.mediaDevices.getUserMedia(constraints);
          } catch (e) {
            // Fallback: alguns devices não suportam "exact" — tenta "ideal"
            console.warn('Fallback para constraints ideais:', e);
            stream = await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: { ideal: facingMode },
                width: { ideal: 1280 },
                height: { ideal: 720 },
                frameRate: { ideal: 30 }
              },
              audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: false
              }
            });
          }

          if (!videoElement) {
            videoElement = document.createElement('video');
            videoElement.autoplay = true;
            videoElement.playsInline = true;
            videoElement.setAttribute('playsinline', '');
            videoElement.setAttribute('webkit-playsinline', '');
            videoElement.muted = true;
            videoElement.volume = 0;
          }
          videoElement.srcObject = stream;

          await new Promise((resolve) => {
            if (videoElement.readyState >= 2) return resolve();
            videoElement.onloadedmetadata = () => resolve();
            setTimeout(resolve, 3000);
          });

          await videoElement.play().catch(() => {});
          isCameraReady = true;

          // Warm-up: aguarda ~400ms para a câmera estabilizar exposição/foco
          cameraWarmupUntil = performance.now() + 400;

          if (!glProgram) {
            glProgram = initWebGL();
            if (!glProgram) throw new Error('Falha ao inicializar WebGL');
          }

          resizeCanvas();

          if (isRendering) {
            isRendering = false;
            if (animationFrame) cancelAnimationFrame(animationFrame);
          }
          isRendering = true;
          lastFrameTime = 0;
          animationFrame = requestAnimationFrame(renderLoop);

          startupScreen.classList.add('hidden');
          updateDate();

          console.log(`📷 Câmera ativa: ${facingMode} @ ${videoElement.videoWidth}x${videoElement.videoHeight}`);

        } catch (error) {
          console.error('Erro ao acessar câmera:', error);
          showToast('❌ Não foi possível acessar a câmera', 3000);
          startupScreen.classList.remove('hidden');
        } finally {
          isStarting = false;
        }
      }

      function stopCamera() {
        isCameraReady = false;
        isRendering = false;
        if (animationFrame) { cancelAnimationFrame(animationFrame); animationFrame = null; }
        if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      }

      // ============================================================
      // TOAST
      // ============================================================
      function showToast(message, duration = 2500) {
        toast.textContent = message;
        toast.classList.add('show');
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => toast.classList.remove('show'), duration);
      }

      // ============================================================
      // CAPTURA DE FOTO
      // ============================================================
      function captureFrame() {
        drawFrame(performance.now());
        return new Promise((resolve, reject) => {
          try {
            canvas.toBlob((blob) => {
              if (blob) resolve(blob);
              else reject(new Error('Falha ao gerar blob'));
            }, 'image/jpeg', 0.95);
          } catch (e) { reject(e); }
        });
      }

      function downloadBlob(blob, fileName) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      }

      async function takePhoto() {
        if (isRecording) return;
        try {
          const blob = await captureFrame();
          const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
          downloadBlob(blob, `VHS_FOTO_${timestamp}.jpg`);
          showToast('✅ Foto salva', 2500);

          const flash = document.createElement('div');
          flash.style.cssText = 'position:absolute;inset:0;z-index:50;background:white;opacity:0.85;pointer-events:none;transition:opacity 0.2s;';
          document.getElementById('app').appendChild(flash);
          requestAnimationFrame(() => { flash.style.opacity = '0'; });
          setTimeout(() => flash.remove(), 300);

          if (navigator.vibrate) navigator.vibrate(30);
        } catch (error) {
          console.error('Erro ao tirar foto:', error);
          showToast('❌ Erro ao tirar foto', 2000);
        }
      }

      // ============================================================
      // GRAVAÇÃO
      // ============================================================
      function startRecording() {
        if (isRecording || !stream) return;

        try {
          const canvasStream = canvas.captureStream(30);
          const audioTracks = stream.getAudioTracks();
          if (audioTracks.length > 0) canvasStream.addTrack(audioTracks[0]);

          const mimeTypes = [
            'video/webm;codecs=vp9,opus',
            'video/webm;codecs=vp8,opus',
            'video/webm;codecs=vp9',
            'video/webm;codecs=vp8',
            'video/webm',
            'video/mp4'
          ];
          let mimeType = '';
          for (const t of mimeTypes) {
            if (MediaRecorder.isTypeSupported(t)) { mimeType = t; break; }
          }

          recordedChunks = [];
          const options = { videoBitsPerSecond: 5000000 };
          if (mimeType) options.mimeType = mimeType;

          mediaRecorder = new MediaRecorder(canvasStream, options);

          mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) recordedChunks.push(e.data);
          };

          mediaRecorder.onstop = () => {
            try {
              const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
              const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
              const ext = (mediaRecorder.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
              downloadBlob(blob, `VHS_VIDEO_${timestamp}.${ext}`);
              showToast('✅ Vídeo salvo', 2500);
            } catch (e) {
              console.error('Erro ao salvar vídeo:', e);
              showToast('❌ Erro ao salvar vídeo', 2000);
            }
            recordedChunks = [];
          };

          mediaRecorder.onerror = (e) => {
            console.error('MediaRecorder error:', e);
            showToast('❌ Erro na gravação', 2000);
            stopRecording();
          };

          mediaRecorder.start(1000);
          isRecording = true;

          recDot.classList.add('recording');
          recText.textContent = 'REC';
          captureBtn.textContent = '⏹';
          captureBtn.classList.add('recording-mode');
          timerDisplay.style.display = 'inline';
          recordingStartTime = Date.now();

          if (timerInterval) clearInterval(timerInterval);
          timerInterval = setInterval(() => {
            const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
            const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
            const secs = String(elapsed % 60).padStart(2, '0');
            timerDisplay.textContent = `${mins}:${secs}`;
          }, 500);

          showToast('🎥 Gravando...', 1000);
          if (navigator.vibrate) navigator.vibrate(50);
        } catch (e) {
          console.error('Erro ao iniciar gravação:', e);
          showToast('❌ Gravação não suportada', 2000);
          isRecording = false;
        }
      }

      function stopRecording() {
        if (!isRecording || !mediaRecorder) return;
        try {
          if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        } catch (e) { console.warn(e); }

        isRecording = false;
        recDot.classList.remove('recording');
        recText.textContent = 'STBY';
        captureBtn.textContent = '●';
        captureBtn.classList.remove('recording-mode');
        timerDisplay.style.display = 'none';

        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        timerDisplay.textContent = '00:00';

        showToast('💾 Salvando...', 2000);
        if (navigator.vibrate) navigator.vibrate(50);
      }

      function handleCapture() {
        if (isRecording) stopRecording();
        else if (captureMode === 'photo') takePhoto();
        else startRecording();
      }

      // ============================================================
      // PINCH ZOOM
      // ============================================================
      let lastTouchDistance = 0;
      let isPinching = false;

      function getTouchDistance(touches) {
        if (touches.length < 2) return 0;
        return Math.hypot(
          touches[0].clientX - touches[1].clientX,
          touches[0].clientY - touches[1].clientY
        );
      }

      function updateZoomUI(z) {
        $('zoomSlider').value = Math.min(40, Math.max(10, Math.round((z - 0.5) / 3.5 * 30 + 10)));
        $('zoomVal').textContent = z.toFixed(1) + 'x';
        zoomIndicator.textContent = z.toFixed(1) + 'x';
        zoomIndicator.classList.add('visible');
        if (zoomTimeout) clearTimeout(zoomTimeout);
        zoomTimeout = setTimeout(() => zoomIndicator.classList.remove('visible'), 1000);
      }

      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          isPinching = true;
          lastTouchDistance = getTouchDistance(e.touches);
          zoomIndicator.classList.add('visible');
          zoomIndicator.textContent = settings.zoom.toFixed(1) + 'x';
        }
      }, { passive: true });

      canvas.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && isPinching) {
          e.preventDefault();
          const distance = getTouchDistance(e.touches);
          const delta = distance - lastTouchDistance;
          lastTouchDistance = distance;

          settings.zoom = Math.max(0.5, Math.min(4.0, settings.zoom + delta * 0.01));
          updateZoomUI(settings.zoom);
        }
      }, { passive: false });

      canvas.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) {
          isPinching = false;
          if (zoomTimeout) clearTimeout(zoomTimeout);
          zoomTimeout = setTimeout(() => zoomIndicator.classList.remove('visible'), 500);
        }
      }, { passive: true });

      // ============================================================
      // EVENTOS
      // ============================================================
      startBtn.addEventListener('click', startCamera);
      captureBtn.addEventListener('click', handleCapture);

      switchCameraBtn.addEventListener('click', async () => {
        if (isRecording) stopRecording();
        facingMode = facingMode === 'environment' ? 'user' : 'environment';
        await startCamera();
        if (navigator.vibrate) navigator.vibrate(20);
      });

      function openSettings() {
        settingsPanel.classList.add('open');
        panelBackdrop.classList.add('open');
        if (navigator.vibrate) navigator.vibrate(15);
      }
      function closeSettings() {
        settingsPanel.classList.remove('open');
        panelBackdrop.classList.remove('open');
      }

      settingsBtn.addEventListener('click', () => {
        settingsPanel.classList.contains('open') ? closeSettings() : openSettings();
      });
      settingsClose.addEventListener('click', closeSettings);
      panelBackdrop.addEventListener('click', closeSettings);
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSettings(); });

      modeToggleBtn.addEventListener('click', () => {
        if (isRecording) stopRecording();
        if (captureMode === 'photo') {
          captureMode = 'video';
          modeToggleBtn.textContent = '🎥 MODO VÍDEO';
          modeToggleBtn.className = 'mode-toggle-btn video';
          modeIndicator.textContent = '🎥 VÍDEO';
          modeIndicator.className = 'mode-indicator video-mode';
        } else {
          captureMode = 'photo';
          modeToggleBtn.textContent = '📷 MODO FOTO';
          modeToggleBtn.className = 'mode-toggle-btn photo';
          modeIndicator.textContent = '📷 FOTO';
          modeIndicator.className = 'mode-indicator photo-mode';
        }
        if (navigator.vibrate) navigator.vibrate(20);
      });

      function updateOrientationButtons() {
        flipHorizontalBtn.classList.toggle('active', settings.flipH);
        flipVerticalBtn.classList.toggle('active', settings.flipV);
      }
      flipHorizontalBtn.addEventListener('click', () => {
        settings.flipH = !settings.flipH;
        updateOrientationButtons();
        if (navigator.vibrate) navigator.vibrate(15);
      });
      flipVerticalBtn.addEventListener('click', () => {
        settings.flipV = !settings.flipV;
        updateOrientationButtons();
        if (navigator.vibrate) navigator.vibrate(15);
      });
      resetOrientationBtn.addEventListener('click', () => {
        settings.flipH = false; settings.flipV = false;
        updateOrientationButtons();
        if (navigator.vibrate) navigator.vibrate(15);
      });

      function bindSlider(slider, display, key, transform, format) {
        slider.addEventListener('input', () => {
          const val = transform(parseFloat(slider.value));
          settings[key] = val;
          display.textContent = format(val);
          if (key === 'zoom') updateZoomUI(val);
        });
      }

      bindSlider($('zoomSlider'), $('zoomVal'), 'zoom', (v) => 0.5 + (v - 10) / 30 * 3.5, (v) => v.toFixed(1) + 'x');
      bindSlider($('brightnessSlider'), $('brightnessVal'), 'brightness', (v) => v / 100, (v) => Math.round(v * 100) + '%');
      bindSlider($('contrastSlider'), $('contrastVal'), 'contrast', (v) => v / 100, (v) => Math.round(v * 100) + '%');
      bindSlider($('redSlider'), $('redVal'), 'red', (v) => v / 100, (v) => Math.round(v * 100) + '%');
      bindSlider($('greenSlider'), $('greenVal'), 'green', (v) => v / 100, (v) => Math.round(v * 100) + '%');
      bindSlider($('blueSlider'), $('blueVal'), 'blue', (v) => v / 100, (v) => Math.round(v * 100) + '%');
      bindSlider($('noiseSlider'), $('noiseVal'), 'noise', (v) => v / 100, (v) => Math.round(v * 100) + '%');
      bindSlider($('chromaSlider'), $('chromaVal'), 'chroma', (v) => v / 100, (v) => Math.round(v * 100) + '%');
      bindSlider($('jitterSlider'), $('jitterVal'), 'jitter', (v) => v / 100, (v) => Math.round(v * 100) + '%');
      bindSlider($('scanSlider'), $('scanVal'), 'scanlines', (v) => v / 100, (v) => Math.round(v * 100) + '%');

      resetAllBtn.addEventListener('click', () => {
        settings = { ...DEFAULT_SETTINGS };
        $('zoomSlider').value = 20; $('zoomVal').textContent = '1.0x';
        $('brightnessSlider').value = 100; $('brightnessVal').textContent = '100%';
        $('contrastSlider').value = 100; $('contrastVal').textContent = '100%';
        $('redSlider').value = 100; $('redVal').textContent = '100%';
        $('greenSlider').value = 100; $('greenVal').textContent = '100%';
        $('blueSlider').value = 100; $('blueVal').textContent = '100%';
        $('noiseSlider').value = 15; $('noiseVal').textContent = '15%';
        $('chromaSlider').value = 20; $('chromaVal').textContent = '20%';
        $('jitterSlider').value = 8; $('jitterVal').textContent = '8%';
        $('scanSlider').value = 12; $('scanVal').textContent = '12%';
        updateOrientationButtons();
        showToast('⟲ Padrões restaurados', 1500);
        if (navigator.vibrate) navigator.vibrate(20);
      });

      let resizeTimeout = null;
      window.addEventListener('resize', () => {
        if (resizeTimeout) clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(resizeCanvas, 150);
      });
      window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 300));

      function randomTapeEffect() {
        if (isCameraReady && Math.random() < 0.005) {
          const tracking = document.createElement('div');
          tracking.style.cssText = `
            position: absolute; left: 0; right: 0;
            height: 2px; z-index: 8;
            background: rgba(255,255,255,0.6);
            box-shadow: 0 0 15px rgba(255,255,255,0.8);
            top: ${5 + Math.random() * 85}%;
            opacity: 1; transition: all 0.3s;
            pointer-events: none;
          `;
          document.getElementById('app').appendChild(tracking);
          setTimeout(() => {
            tracking.style.opacity = '0';
            tracking.style.transform = 'translateY(20px)';
          }, 100);
          setTimeout(() => tracking.remove(), 500);
        }
        tapeEffectTimeout = setTimeout(randomTapeEffect, 200);
      }

      function updateDate() {
        const now = new Date();
        const day = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        dateDisplay.textContent = `${month}/${day}/${now.getFullYear()}`;
      }
      updateDate();
      setInterval(updateDate, 60000);

      window.addEventListener('beforeunload', () => {
        stopCamera();
        if (tapeEffectTimeout) clearTimeout(tapeEffectTimeout);
        if (timerInterval) clearInterval(timerInterval);
        if (toastTimeout) clearTimeout(toastTimeout);
        if (zoomTimeout) clearTimeout(zoomTimeout);
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden && isRecording) stopRecording();
      });

      updateOrientationButtons();
      randomTapeEffect();

      console.log('📼 VHS Camera Profissional v2.2');
    })();
  </script>
</body>
